name: Pobierz newsy badawcze

on:
  schedule:
    # codziennie o 6:00 UTC (8:00 czasu polskiego latem)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # pozwala odpalić ręcznie z zakładki Actions

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz dane ze źródeł
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_news.py

      - name: Commit i push jeśli są zmiany
        run: |
          git config user.name "bioinfonews-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research-news.json
          git diff --staged --quiet || git commit -m "auto: aktualizacja research-news.json"
          git push
