name: Pobierz newsy badawcze

on:
  schedule:
    # codziennie o 6:00 UTC (8:00 czasu polskiego latem)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # pozwala odpalić ręcznie z zakładki Actions
  push:
    paths: ["news.json"]  # walidacja news.json po każdej ręcznej zmianie

concurrency:
  group: bioinfo-news-data
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Walidacja news.json (zdublowane id, daty, linki)
        run: python scripts/add_entry.py --check

  fetch:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz dane ze źródeł
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_news.py

      - name: Commit i push jeśli są zmiany
        run: |
          git config user.name "bioinfonews-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research-news.json archive/
          git diff --staged --quiet && exit 0
          git commit -m "auto: aktualizacja newsów badawczych"
          git pull --rebase origin main
          git push origin main
